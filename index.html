        * {

            padding: 0;
            margin: 0;
        }
        .form-container{

            font-size: 18px !important;
            padding: 30px;
            color: #494949 !important;
        }
        .a-block, .b-block {
            display: flex;
            column-gap: 24px;
            margin-bottom: 12px;
            
            justify-content: space-between;
        }
        .a-1 {
            width: 49%;
            display: flex;
            flex-direction: column;
        }
        /* .label-cls{
            
        } */
        .input, textarea, select {
            margin-top: 8px;
            font-size: 18px;
            padding: 6px 24px;
            width: 100%;
            background-color: #f6f7fa !important;
            border: 1px solid #eaecf1 !important;
            border-radius: 6px !important;
            font-family: 'Poppins', sans-serif;
            transition: border 0.3s;
            color: #494949 !important;
        }
        .input:focus, textarea:focus, select:focus {
            border: 1px solid #9bb1ff !important;
            outline: none;
        }
        .AlertPara {
            font-size: 8px;
            color: red;
            /* display: none; */
            visibility: hidden;
            margin: 0px;
           
        }
        .full-width {
            width: 100%;
        }
        .checkbox-container {
            margin-bottom: 20px;
        }
        .submit-btn {
            background-color: #731819 ;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: #E89D2B;
        }


        @media screen and (max-width: 768px) {

            .form-container{
                padding: 20px;
            }
            
            .a-block, .b-block {
                flex-direction: row;
                gap: 12px;
                margin-bottom: 12px;
                flex-wrap: wrap;
            }
            .a-1 {
                width: 100%;
                display: flex;
                flex-direction: column;
            }

        }


    </style>
